<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Ari's Collector Vault</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
        background: #070b12;
        color: #eef5f2;
      }
      main {
        width: min(28rem, 100%);
        padding: 1.75rem;
        border: 1px solid rgba(101, 247, 213, 0.22);
        border-radius: 1.15rem;
        background: #0c1411;
      }
      h1 { margin: 0 0 0.6rem; font-size: 1.45rem; }
      p { margin: 0; color: #b7c3be; line-height: 1.55; }
      a {
        display: inline-block;
        margin-top: 1.1rem;
        color: #03100c;
        background: #65f7d5;
        text-decoration: none;
        font-weight: 800;
        padding: 0.7rem 1rem;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Ari's Collector Vault needs a connection to sign in and open your private collection. Photos and records are not stored in this offline page.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
